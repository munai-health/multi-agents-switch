[project]
name = "multi-agents-switch"
version = "0.1.0"
description = ""
authors = [{ name = "Luan Dalmazo", email = "luan.dalmazo@munai.com.br" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langchain (>=1.3.1,<2.0.0)",
  "langgraph (>=1.2.1,<2.0.0)",
  "langchain-openai (>=1.2.2,<2.0.0)",
  "langchain-pinecone (>=0.2.13,<0.3.0)",
  "httpx (>=0.28.1,<0.29.0)",
  "pydantic-settings (>=2.14.1,<3.0.0)",
  "langchain-anthropic (>=1.4.3,<2.0.0)",
  "pinecone[grpc] (>=7.0.0,<8.0.0)",
  "llama-index (>=0.14.22,<0.15.0)",
  "llama-index-vector-stores-pinecone (>=0.8.0,<0.9.0)",
  "langchain-aws (>=1.5.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[tool.pytest.ini_options]
python_files = "test_*.py"
